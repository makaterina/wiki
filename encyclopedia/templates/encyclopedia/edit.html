{% extends "encyclopedia/layout.html" %}

{% block title %}
    Edit Page
{% endblock %}

{% block body %}
    <h1>Edit Page</h1>

    <form action="{% url 'edit' %}" method="post">
        {% csrf_token %}
        <input type="hidden" name="title" value="{{ title }}">
        <textarea name="content" rows="10" cols="50">{{ content }}</textarea>
        <br>
        <button type="submit">Save Changes</button>
    </form>
{% endblock %}
